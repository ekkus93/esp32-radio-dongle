name: Firmware CI

on:
  push:
    branches:
      - master
    paths:
      - firmware/**
      - tests/**
      - scripts/**
      - .github/workflows/firmware-ci.yml
  pull_request:
    paths:
      - firmware/**
      - tests/**
      - scripts/**
      - .github/workflows/firmware-ci.yml

permissions:
  contents: read

jobs:
  host-tests:
    name: Host transport tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check C formatting
        run: |
          mapfile -d '' files < <(
            find firmware tests -type f \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' \) -print0
          )
          clang-format -i "${files[@]}"
          if ! git diff --exit-code -- firmware tests; then
            git diff -- firmware tests > clang-format.patch
            exit 1
          fi

      - name: Upload clang-format patch
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: clang-format-patch
          path: clang-format.patch
          if-no-files-found: ignore

      - name: Check release logging policy
        run: bash scripts/check-release-logging.sh

      - name: Check component boundary policy
        run: bash scripts/check-component-boundaries.sh

      - name: Build H4 host tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ifirmware/components/radio_h4/include \
            firmware/components/radio_h4/radio_h4.c \
            tests/host/test_radio_h4.c \
            -o /tmp/test_radio_h4

      - name: Run H4 host tests
        run: /tmp/test_radio_h4

      - name: Build USB Bluetooth class host tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Itests/host/stubs \
            -Ifirmware/esp32s3_usb_bridge/components/radio_usb_bth/include \
            firmware/esp32s3_usb_bridge/components/radio_usb_bth/radio_usb_bth.c \
            tests/host/test_radio_usb_bth.c \
            -o /tmp/test_radio_usb_bth

      - name: Run USB Bluetooth class host tests
        run: /tmp/test_radio_usb_bth

      - name: Build USB descriptor host tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Itests/host/stubs \
            -Ifirmware/esp32s3_usb_bridge/main \
            firmware/esp32s3_usb_bridge/main/usb_descriptors.c \
            tests/host/test_usb_descriptors.c \
            -o /tmp/test_usb_descriptors

      - name: Run USB descriptor host tests
        run: /tmp/test_usb_descriptors

  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ESP32-WROOM-32 controller
            target: esp32
            path: firmware/esp32_wroom_bt_controller
            artifact_suffix: esp32-controller
          - name: ESP32-S3 USB bridge
            target: esp32s3
            path: firmware/esp32s3_usb_bridge
            artifact_suffix: esp32s3-bridge
          - name: ESP32-WROOM-32 UART smoke test
            target: esp32
            path: firmware/bringup/esp32_wroom_uart_smoke
            artifact_suffix: esp32-uart-smoke
          - name: ESP32-S3 UART smoke test
            target: esp32s3
            path: firmware/bringup/esp32s3_uart_smoke
            artifact_suffix: esp32s3-uart-smoke

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build with ESP-IDF v5.5.5
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: ${{ matrix.target }}
          path: ${{ matrix.path }}
          command: set -o pipefail; idf.py build 2>&1 | tee ci-build.log

      - name: Upload failed firmware build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: firmware-build-log-${{ matrix.artifact_suffix }}
          path: ${{ matrix.path }}/ci-build.log
          if-no-files-found: error

  release-build:
    name: Release build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ESP32-WROOM-32 controller
            target: esp32
            path: firmware/esp32_wroom_bt_controller
            artifact_suffix: esp32-controller
          - name: ESP32-S3 USB bridge
            target: esp32s3
            path: firmware/esp32s3_usb_bridge
            artifact_suffix: esp32s3-bridge

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build release profile with ESP-IDF v5.5.5
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: ${{ matrix.target }}
          path: ${{ matrix.path }}
          command: >-
            set -euo pipefail;
            rm -f sdkconfig;
            SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.release" idf.py build 2>&1 | tee ci-release-build.log;
            grep -E "CONFIG_(LOG_DEFAULT_LEVEL|LOG_MAXIMUM|LOG_COLORS|BOOTLOADER_LOG_LEVEL|APP_REPRODUCIBLE_BUILD)" sdkconfig || true;
            grep -qx "CONFIG_LOG_DEFAULT_LEVEL_WARN=y" sdkconfig;
            grep -qx "CONFIG_LOG_MAXIMUM_EQUALS_DEFAULT=y" sdkconfig;
            grep -qx "# CONFIG_LOG_COLORS is not set" sdkconfig;
            grep -qx "CONFIG_BOOTLOADER_LOG_LEVEL_WARN=y" sdkconfig;
            grep -qx "CONFIG_APP_REPRODUCIBLE_BUILD=y" sdkconfig;
            cd build;
            find . -type f -name "*.bin" -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Upload failed release build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-build-log-${{ matrix.artifact_suffix }}
          path: ${{ matrix.path }}/ci-release-build.log
          if-no-files-found: error

      - name: Upload release flash inputs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: v1-release-${{ matrix.artifact_suffix }}-${{ github.sha }}
          path: |
            ${{ matrix.path }}/build/*.bin
            ${{ matrix.path }}/build/bootloader/*.bin
            ${{ matrix.path }}/build/partition_table/*.bin
            ${{ matrix.path }}/build/flash_args
            ${{ matrix.path }}/build/flasher_args.json
            ${{ matrix.path }}/build/SHA256SUMS.txt
          if-no-files-found: error
