name: Firmware CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host transport tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check C formatting
        run: |
          find firmware tests -type f \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' \) \
            -print0 | xargs -0 -r clang-format --dry-run --Werror

      - name: Build H4 host tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ifirmware/components/radio_h4/include \
            firmware/components/radio_h4/radio_h4.c \
            tests/host/test_radio_h4.c \
            -o /tmp/test_radio_h4

      - name: Run H4 host tests
        run: /tmp/test_radio_h4

  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ESP32-WROOM-32 controller
            target: esp32
            path: firmware/esp32_wroom_bt_controller
          - name: ESP32-S3 USB bridge
            target: esp32s3
            path: firmware/esp32s3_usb_bridge

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build with ESP-IDF v5.5.5
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: ${{ matrix.target }}
          path: ${{ matrix.path }}
