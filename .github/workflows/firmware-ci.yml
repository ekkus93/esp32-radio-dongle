name: Firmware CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: write

jobs:
  host-tests:
    name: Host transport tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Apply one-time C formatting
        run: |
          mapfile -d '' files < <(
            find firmware tests -type f \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' \) -print0
          )
          clang-format -i "${files[@]}"
          if ! git diff --quiet -- firmware tests; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add firmware tests
            git commit -m "style: apply clang-format"
            git push origin HEAD:master
          fi

      - name: Build H4 host tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ifirmware/components/radio_h4/include \
            firmware/components/radio_h4/radio_h4.c \
            tests/host/test_radio_h4.c \
            -o /tmp/test_radio_h4

      - name: Run H4 host tests
        run: /tmp/test_radio_h4

  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ESP32-WROOM-32 controller
            target: esp32
            path: firmware/esp32_wroom_bt_controller
          - name: ESP32-S3 USB bridge
            target: esp32s3
            path: firmware/esp32s3_usb_bridge

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build with ESP-IDF v5.5.5
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: ${{ matrix.target }}
          path: ${{ matrix.path }}
          command: set -o pipefail; idf.py build 2>&1 | tee ci-build.log

      - name: Upload failed firmware build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: firmware-build-log-${{ matrix.target }}
          path: ${{ matrix.path }}/ci-build.log
          if-no-files-found: error
